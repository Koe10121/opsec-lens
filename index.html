<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpSec Lens</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    #drop { border: 2px dashed #888; padding: 2rem; text-align: center; border-radius: 8px; }
    #drop.over { background: #eef; }
    canvas { max-width: 100%; margin-top: 1rem; border: 1px solid #ccc; }
    #status { margin: .5rem 0; color: #444; }
    #review { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
    #findings { list-style: none; padding: 0; margin: 1rem 0 0; min-width: 220px; }
    #findings li { padding: .25rem 0; }
    canvas:focus-visible, input:focus-visible, button:focus-visible, #drop:focus-visible { outline: 3px solid #05c; outline-offset: 2px; }
    #findings label { cursor: pointer; }
  </style>
</head>
<body>
  <h1>OpSec Lens</h1>
  <p>Images never leave your browser. Detection is not a guarantee: review before sharing.</p>
  <p>The download is re-encoded from the canvas, which strips EXIF metadata (location, camera, etc.).</p>
  <div id="drop" tabindex="0">Drop a PNG here or <input id="file" type="file" accept="image/png" /></div>
  <div id="status" role="status"></div>
  <button id="undo" disabled>Undo</button>
  <button id="redo" disabled>Redo</button>
  <button id="add" disabled>Add box</button>
  <label>Style <select id="style"></select></label>
  <button id="download" disabled>Download redacted PNG</button>
  <div id="review">
    <canvas id="view" hidden tabindex="0" role="img" aria-label="Screenshot. Press Enter to add a box by keyboard, or drag with the mouse."></canvas>
    <ul id="findings" aria-label="Findings"></ul>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
